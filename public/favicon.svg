<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle (keeps the circle silhouette from original) -->
  <circle cx="50" cy="50" r="50" fill="#15803d"/>
  <!-- Leaf shape: a classic pointed leaf with center vein -->
  <!-- Main leaf body -->
  <path d="M50 18 C30 28, 20 42, 22 58 C24 72, 36 82, 50 84 C64 82, 76 72, 78 58 C80 42, 70 28, 50 18 Z"
        fill="#ffffff" opacity="0.95"/>
  <!-- Center vein -->
  <line x1="50" y1="22" x2="50" y2="80"
        stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left side veins -->
  <line x1="50" y1="42" x2="32" y2="55"
        stroke="#15803d" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="55" x2="30" y2="66"
        stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- Right side veins -->
  <line x1="50" y1="42" x2="68" y2="55"
        stroke="#15803d" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="55" x2="70" y2="66"
        stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>
